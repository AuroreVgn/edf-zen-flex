name: "🐛 Signaler un bug"
description: "Signaler un dysfonctionnement de l’intégration EDF Zen Flex."
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Merci de vérifier les issues existantes avant de créer un nouveau signalement. Ne publiez aucune donnée personnelle, clé API ou identifiant sensible."
  - type: input
    id: version
    attributes:
      label: "Version de l’intégration"
      placeholder: "Ex. : 0.0.4"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: "Version de Home Assistant"
      placeholder: "Ex. : 2026.10.0"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: "Mode d’installation"
      options:
        - HACS
        - Manuel
        - Autre
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description du problème"
      description: "Expliquez clairement ce qui ne fonctionne pas."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Étapes pour reproduire"
      placeholder: "1. Ouvrir…\n2. Cliquer sur…\n3. Constater…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Comportement attendu"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Comportement observé"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Journaux et informations complémentaires"
      description: "Ajoutez des extraits utiles en supprimant les informations sensibles."
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: "Vérifications"
      options:
        - label: "J’ai recherché si ce problème avait déjà été signalé."
          required: true
        - label: "J’utilise une version récente et j’ai retiré les informations sensibles."
          required: true
